[package]
name = "peernet-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "peernet_core"
crate-type = ["cdylib", "rlib"]
# Doctest compilation trips over the dual cdylib/rlib artifacts (E0464);
# this crate carries no doc examples.
doctest = false

[dependencies]
jni = { workspace = true }
peernet-core = { path = "../peernet-core" }
peernet-proto = { path = "../peernet-proto" }
peernet-host = { path = "../peernet-host" }
peernet-client = { path = "../peernet-client" }
peernet-tcp = { path = "../peernet-tcp" }
quinn = { workspace = true }
tokio = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"
