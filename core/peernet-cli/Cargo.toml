[package]
name = "peernet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PeerNet Windows CLI client"

[[bin]]
name = "peernet"
path = "src/main.rs"

[dependencies]
peernet-core = { path = "../peernet-core" }
peernet-proto = { path = "../peernet-proto" }
peernet-client = { path = "../peernet-client" }
peernet-tcp = { path = "../peernet-tcp" }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
bincode = { workspace = true }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
ctrlc = "3"

[target.'cfg(target_os = "windows")'.dependencies]
wintun = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
