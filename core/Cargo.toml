[workspace]
resolver = "2"
members = [
    "peernet-proto",
    "peernet-core",
    "peernet-host",
    "peernet-client",
    "peernet-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
getrandom = "0.2"
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
