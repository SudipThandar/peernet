[workspace]
resolver = "2"
members = [
    "peernet-proto",
    "peernet-core",
    "peernet-host",
    "peernet-client",
    "peernet-tcp",
    "peernet-ffi",
    "peernet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
getrandom = "0.2"
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
quinn = { version = "0.11", features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
bytes = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
