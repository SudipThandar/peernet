name: Android CI

on:
  push:
    branches: [main]
    # Docs/handoff edits don't affect the APK or tests; don't burn CI.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Rust core steps activate automatically once core/Cargo.toml exists (Milestone 2).
      - name: Set up Rust toolchain
        if: hashFiles('core/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        if: hashFiles('core/Cargo.toml') != ''
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        if: hashFiles('core/Cargo.toml') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-${{ runner.os }}-${{ hashFiles('core/**/Cargo.toml', 'core/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Run Rust loopback tests (gate before device testing)
        if: hashFiles('core/Cargo.toml') != ''
        working-directory: core
        run: cargo test --release

      - name: Build Rust core (.so for all ABIs)
        if: hashFiles('core/Cargo.toml') != ''
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 26 \
            -o ../app/src/main/jniLibs \
            build --release

      # An .so linked for 4 KB pages will not load on Android 15+ devices that
      # use 16 KB pages; the app then reports "native engine unavailable" with
      # no other clue. core/.cargo/config.toml sets the link arg — this step
      # proves it actually reached the linker.
      - name: Verify 16 KB page alignment of native libraries
        if: hashFiles('core/Cargo.toml') != ''
        run: |
          set -e
          found=0
          for so in app/src/main/jniLibs/*/*.so; do
            found=1
            bad=$(readelf -lW "$so" | awk '$1=="LOAD" { if (strtonum($NF) < 16384) print $NF }')
            if [ -n "$bad" ]; then
              echo "::error::$so has LOAD segments aligned below 16 KB: $bad"
              readelf -lW "$so" | sed -n '1,25p'
              exit 1
            fi
            echo "$so: LOAD segments aligned >= 16 KB"
          done
          if [ "$found" = "0" ]; then
            echo "::error::no .so found to verify"
            exit 1
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peernet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Catches the platform-contract defects that compile fine and fail only
      # on a device (missing FGS permission for a declared service type, an
      # unbindable exported service, missing runtime permissions).
      - name: Lint platform contracts
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
