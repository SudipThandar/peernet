name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Rust core steps activate automatically once core/Cargo.toml exists (Milestone 2).
      - name: Set up Rust toolchain
        if: hashFiles('core/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        if: hashFiles('core/Cargo.toml') != ''
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        if: hashFiles('core/Cargo.toml') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: rust-${{ runner.os }}-${{ hashFiles('core/**/Cargo.toml', 'core/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Run Rust loopback tests (gate before device testing)
        if: hashFiles('core/Cargo.toml') != ''
        working-directory: core
        run: cargo test --release

      - name: Build Rust core (.so for all ABIs)
        if: hashFiles('core/Cargo.toml') != ''
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            --platform 26 \
            -o app/src/main/jniLibs \
            build --release

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peernet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
